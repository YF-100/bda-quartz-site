# BDA Project Configuration File
# Bitcoin Price Prediction using PySpark
# ESIEE Paris 2025-2026

# Paths configuration
paths:
  # Data directories
  data_root: "data"
  raw_data: "data/raw"
  blocks_data: "data/blocks/blocks"
  prices_data: "data/prices"
  live_data: "data/live"
  
  # Processed data outputs
  transactions_parquet: "data/transactions.parquet"
  live_transactions_parquet: "data/live/live_transactions.parquet"
  transactions_merged_parquet: "data/transactions_merged.parquet"
  blockchain_features_parquet: "data/blockchain_features.parquet"
  advanced_blockchain_features_parquet: "data/advanced_blockchain_features.parquet"
  prices_parquet: "data/prices.parquet"
  price_features_parquet: "data/price_features.parquet"
  features_parquet: "data/features.parquet"
  
  # Output directories
  outputs_dir: "outputs"
  evidence_dir: "evidence"
  models_dir: "outputs/models"
  predictions_dir: "outputs/predictions"
  
  # Logs and metrics
  metrics_log: "project_metrics_log.csv"
  spark_plans_dir: "evidence/spark_plans"

# Spark configuration
spark:
  app_name: "BDA_Bitcoin_Price_Prediction"
  master: "local[*]"
  log_level: "WARN"
  
  # Memory settings
  driver_memory: "4g"
  executor_memory: "4g"
  
  # Optimization settings
  shuffle_partitions: 200
  default_parallelism: 8
  
  # Checkpoint directory (optional)
  checkpoint_dir: "data/checkpoints"

# Blockchain ETL configuration
blockchain:
  # Block parsing settings
  max_block_files: null  # null = parse all blk*.dat files, or set to 5 for testing
  output_partitions: 8   # Number of partitions for transactions.parquet
  
  # Feature aggregation windows
  aggregation_window: "1 hour"  # Options: "1 minute", "1 hour", "1 day"
  
  # Advanced features settings
  utxo_age_bins: [1, 7, 30, 90, 365]  # days
  
  # Parser settings
  validate_transactions: true  # Validate transaction data quality
  skip_coinbase_tx: false      # Whether to skip coinbase transactions
  
# Price data configuration
prices:
  # Kaggle datasets
  kaggle_datasets:
    - "mczielinski/bitcoin-historical-data"
    - "novandraanugrah/bitcoin-historical-datasets-2018-2024"
  
  # Time granularity
  granularity: "1 hour"  # Options: "1 minute", "1 hour", "1 day"
  
  # Technical indicators parameters
  technical_indicators:
    ma_windows: [7, 30]  # Moving average windows in periods
    rsi_window: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bollinger_window: 20
    bollinger_std: 2
    
  # Lagged features
  lag_periods: [1, 3, 6, 24]  # hours or periods based on granularity
  
  # Target variable settings
  prediction_horizon: 1  # periods ahead to predict

# Feature engineering
features:
  # Join strategy
  join_type: "inner"  # inner, left, right, outer
  join_key: "timestamp_hour"  # Common timestamp key for joining
  
  # Feature selection (if applicable)
  drop_correlated_threshold: 0.95  # Drop features with correlation > threshold

# Model training configuration
training:
  # Time-based split (chronological, no shuffle)
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  
  # Target variable
  target_column: "direction_label"  # "direction_label" or "return_magnitude"
  
  # Feature columns (will be determined dynamically, but can specify exclusions)
  exclude_features: ["timestamp", "date", "symbol", "exchange"]
  
  # Seed for reproducibility (where applicable)
  random_seed: 42

# Model hyperparameters
models:
  logistic_regression:
    max_iter: 100
    reg_param: 0.01
    elastic_net_param: 0.0
    
  random_forest:
    num_trees: 100
    max_depth: 10
    max_bins: 32
    min_instances_per_node: 1
    
  gradient_boosted_trees:
    max_iter: 100
    max_depth: 5
    step_size: 0.1
    max_bins: 32
    
  # Cross-validation settings
  cross_validation:
    num_folds: 3
    parallelism: 1

# Evaluation configuration
evaluation:
  # Metrics to compute
  classification_metrics: ["accuracy", "precision", "recall", "f1", "auc"]
  regression_metrics: ["rmse", "mae", "r2"]
  
  # Ablation study configurations
  ablation_experiments:
    - name: "price_only"
      feature_prefix: ["ma_", "rsi", "macd_", "bollinger_", "lag_", "hour_", "day_"]
    - name: "blockchain_only"
      feature_prefix: ["tx_count", "avg_value", "avg_fee", "total_btc", "active_addresses", "velocity"]
    - name: "combined"
      feature_prefix: []  # Empty means use all features

# Reproducibility settings
reproducibility:
  capture_spark_ui: true
  save_explain_plans: true
  log_git_commit: true
  save_environment: true

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARN, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
